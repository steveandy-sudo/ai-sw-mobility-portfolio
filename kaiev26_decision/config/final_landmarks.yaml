schema_version: 1
course_id: kcity_2026_final
ready: true
# Stop line and traffic light geometry comes from the map semantics by id, the same file PV26 and
# the Gazebo world are built from: route_s is where the route crosses the painted line, width_m the
# line length and the light positions the head centres. Only the event wiring lives here; a
# landmark that repeats route_s, x, y, width_m or traffic_light_positions is rejected.
map_semantics: package://kaiev26_maps/maps/kcity/kcity_course_semantics.yaml


# Green, then yellow while the front bumper is still 30 m from the line (more than the stopping
# distance at 7-8 m/s), red 3 s later (D18): stop once before the line and hold.
# F3 and Q4 allow 3.3 m: their brake_margin_m (F3 3.25 for light 305 visibility, Q4 3.20) is kept
# on purpose (owner, 2026-10-16).
name: ${ev.tag}_v${speed}_${brake.tag}
description: yellow far from the line stops
course: ${ev.course}
speed_mps: ${speed}
event: ${ev.id}
start: {distance_before_line_m: "${ev.start}", speed_mps: "${speed}"}
vehicle: {brake_decel_mps2: "${brake.decel}"}
duration_s: 15
world:
  other_lights: [{lamps: [green]}]
  event_lights:
    - {lamps: [green]}
    - {front_gap_le: 30.0, lamps: [yellow]}
    - {after_s: 3.0, lamps: [red]}
expect:
  - {check: stop_count, event: "${ev.id}", count: 1}
  - {check: stop_position, event: "${ev.id}", front_gap_m: "${ev.${brake.window}}"}
  - {check: no_red_crossing, event: "${ev.id}"}
  - {check: brake_held, from: {stop: 1, event: "${ev.id}", plus_s: 0.5}, to: end}
matrix:
  ev:
    - {tag: F1, course: final, start: 45, id: Z1_SIGNAL_OBEY, window_b39: [0, 3], window_b77: [0, null]}
    - {tag: F2, course: final, start: 45, id: Z2_SIGNAL_OBEY, window_b39: [0, 3], window_b77: [0, null]}
    - {tag: F5, course: final, start: 45, id: Z5_SIGNAL_OBEY, window_b39: [0, null], window_b77: [0, null]}
    - {tag: Q2, course: qualifying, start: 36, id: Z2_SIGNAL_OBEY, window_b39: [0, 3], window_b77: [0, null]}
    - {tag: Q4, course: qualifying, start: 36, id: Z4_SIGNAL_OBEY, window_b39: [0, 3.3], window_b77: [0, null]}
  speed: [7, 8]
  brake:
    - {tag: b39, decel: 3.9, window: window_b39}
    - {tag: b77, decel: 7.7, window: window_b77}

cone_colored_path_node:
  ros__parameters:
    detection_topic: /perception/cone/detections
    output_frame: base_link
    stale_timeout_s: 0.5
    processing_hz: 10.0
    min_confidence: 0.5
    roi_x_min: 0.5
    roi_x_max: 25.0
    roi_y_abs: 7.0
    boundary_min_cones: 2
    boundary_min_span: 2.5
    boundary_residual: 0.3
    boundary_max_heading_deg: 30.0
    boundary_max_difference_deg: 10.0
    corridor_width_min: 1.0
    corridor_width_max: 6.5
    path_max_forward: 20.0
    path_min_forward: 4.0
    path_step: 0.25
    red_gate_max_stagger_m: 2.0

cone_pursuit_node:
  ros__parameters:
    target_speed_kph: 5.0
    wheelbase_m: 1.2991017929
    lookahead_base_m: 7.0
    lookahead_gain_s: 0.0
    lookahead_max_m: 7.0
    max_steering_rad: 0.4363
    steering_rate_radps: 1.0471975512
    acceleration_mps2: 1.0
    path_timeout_s: 0.35
    state_timeout_s: 0.25
    red_front_offset_m: 1.98
    red_confirm_frames: 2
    red_gate_match_m: 1.0
    red_brake_lead_m: 0.0
    red_tracking_stop_speed_mps: 0.5
    input_wall_timeout_s: 0.75
    control_hz: 50.0
    path_topic: /aeb/center_path
    state_topic: /vehicle/state
    command_topic: ""
    enabled: false

cone_stanley_node:

kaiev26_decision_fox:
  ros__parameters:
    use_sim_time: false
    odometry_topic: /localization/odometry
    route_context_topic: /planning/route_context
    trajectory_topic: /debug/decision_fox/trajectory
    marker_topic: /debug/decision_fox/markers
